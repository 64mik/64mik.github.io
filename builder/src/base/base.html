<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="/assets/js/init.js"></script>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">

</head>
<body>
    <div id="navbar" class="navbar">
        <div><img src="/assets/images/icon/64mik_icon.png" alt="64mik Icon" id="main-icon"></div>
        <button id="theme-btn">O</button>
        <span class="icon">{{version}}</span>
        <a href="/index.html"><span class="icon"><img src="/assets/images/icon/home_icon.png" alt="Home icon" style="width: 30px; height: 30px;"></img></span><span class="navbar-text">Home</span></a>
        <a href="/pages/about.html"><span class="icon"><img src="/assets/images/icon/about_icon.png" alt="Home icon" style="width: 30px; height: 30px;"></img></span><span class="navbar-text">About</span></a>
        <a href="/pages/post.html"><span class="icon"><img src="/assets/images/icon/post_icon.png" alt="Home icon" style="width: 30px; height: 30px;"></img></span><span class="navbar-text">Post</span></a>
        <a href="/pages/projects.html"><span class="icon"><img src="/assets/images/icon/projects_icon.png" alt="Home icon" style="width: 30px; height: 30px;"></img></span><span class="navbar-text">Projects</span></a>
        <a href="/index.html"><span class="icon"><img src="/assets/images/icon/categories_icon.png" alt="Home icon" style="width: 30px; height: 30px;"></img></span><span class="navbar-text">Categories</span></a>
    </div>
    <div id="content" class="content">
        <p><strong>Date:</strong> {{date}}</p>
        <p><strong>Lore:</strong> {{lore}}</p>
        <p><strong>Tags:</strong> {{tags}}</p>
        <p><strong>Category:</strong> {{category}}</p>
{{content}}
    </div>
    <script src="/assets/js/theme.js"></script>
</body>
</html>
